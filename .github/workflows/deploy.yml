name: CI/CD Pipeline - AI Architecture Analyzer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  AWS_REGION: us-east-1

jobs:
  test-java-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, upload-service, report-service, status-service]
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build and Test with Maven
        run: cd ${{ matrix.service }} && mvn clean test

  test-python-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [processing-service, ai-analysis-service]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies and Run Pytest
        run: |
          cd ${{ matrix.service }}
          pip install -r requirements.txt
          pip install pytest
          pytest

  build-and-push-ecr:
    needs: [test-java-services, test-python-services]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Example for one service. Loop or matrix for others.
          docker build -t $ECR_REGISTRY/api-gateway-prod:latest ./api-gateway
          docker push $ECR_REGISTRY/api-gateway-prod:latest
