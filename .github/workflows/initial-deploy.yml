name: Initial Deploy (All Services)

on:
  workflow_dispatch:
    inputs:
      init_database:
        description: "Create logical databases (upload_db, report_db, status_db)"
        required: false
        default: true
        type: boolean

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: architecture-cluster-dev
  ECR_REGISTRY: 177515264693.dkr.ecr.us-east-1.amazonaws.com

permissions:
  contents: read

jobs:
  # ============================================================
  # Step 1: Initialize databases (one-time)
  # ============================================================
  init-database:
    runs-on: ubuntu-latest
    if: inputs.init_database
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get infrastructure info
        id: infra
        run: |
          RDS_HOST=$(aws rds describe-db-instances --db-instance-identifier architecture-db-dev --query 'DBInstances[0].Endpoint.Address' --output text)
          SUBNET=$(aws ec2 describe-subnets --filters "Name=tag:Name,Values=architecture-public-1-dev" --query 'Subnets[0].SubnetId' --output text)
          SG=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=architecture-ecs-sg-dev" --query 'SecurityGroups[0].GroupId' --output text)
          echo "rds_host=$RDS_HOST" >> $GITHUB_OUTPUT
          echo "subnet=$SUBNET" >> $GITHUB_OUTPUT
          echo "sg=$SG" >> $GITHUB_OUTPUT

      - name: Register db-init task
        run: |
          aws ecs register-task-definition \
            --family db-init-task \
            --network-mode awsvpc \
            --requires-compatibilities FARGATE \
            --cpu 256 \
            --memory 512 \
            --execution-role-arn "arn:aws:iam::177515264693:role/ecs-execution-role-dev" \
            --container-definitions "[{
              \"name\": \"db-init\",
              \"image\": \"postgres:15-alpine\",
              \"essential\": true,
              \"command\": [\"sh\", \"-c\", \"PGPASSWORD=$DB_PASSWORD psql -h $RDS_HOST -U postgres -d architecturedb -c 'CREATE DATABASE upload_db;' -c 'CREATE DATABASE report_db;' -c 'CREATE DATABASE status_db;' || echo 'Databases may already exist'\"],
              \"environment\": [
                {\"name\": \"RDS_HOST\", \"value\": \"${{ steps.infra.outputs.rds_host }}\"},
                {\"name\": \"DB_PASSWORD\", \"value\": \"${{ secrets.DB_PASSWORD }}\"}
              ],
              \"logConfiguration\": {
                \"logDriver\": \"awslogs\",
                \"options\": {
                  \"awslogs-group\": \"/ecs/api-gateway-dev\",
                  \"awslogs-region\": \"us-east-1\",
                  \"awslogs-stream-prefix\": \"db-init\"
                }
              }
            }]"

      - name: Run db-init task
        id: run-task
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition db-init-task \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ steps.infra.outputs.subnet }}],securityGroups=[${{ steps.infra.outputs.sg }}],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "task_arn=$TASK_ARN" >> $GITHUB_OUTPUT

      - name: Wait for db-init to complete
        run: |
          aws ecs wait tasks-stopped --cluster ${{ env.ECS_CLUSTER }} --tasks ${{ steps.run-task.outputs.task_arn }}
          EXIT_CODE=$(aws ecs describe-tasks --cluster ${{ env.ECS_CLUSTER }} --tasks ${{ steps.run-task.outputs.task_arn }} --query 'tasks[0].containers[0].exitCode' --output text)
          echo "DB init exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "WARNING: DB init exited with code $EXIT_CODE (databases may already exist)"
          fi

  # ============================================================
  # Step 2: Build and deploy all Java services
  # ============================================================
  deploy-java:
    runs-on: ubuntu-latest
    needs: init-database
    if: always() && (needs.init-database.result == 'success' || needs.init-database.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            ecr_repo: architecture/api-gateway
            ecs_service: api-gateway-dev
            task_family: api-gateway-dev
            container: api-gateway
          - service: upload-service
            ecr_repo: architecture/upload-service
            ecs_service: upload-service-dev
            task_family: upload-service-dev
            container: upload-service
          - service: report-service
            ecr_repo: architecture/report-service
            ecs_service: report-service-dev
            task_family: report-service-dev
            container: report-service
          - service: status-service
            ecr_repo: architecture/status-service
            ecs_service: status-service-dev
            task_family: status-service-dev
            container: status-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        working-directory: ${{ matrix.service }}
        run: mvn -B clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:$IMAGE_TAG -t ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:latest ./${{ matrix.service }}
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:$IMAGE_TAG
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:latest

      - name: Deploy to ECS
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:$IMAGE_TAG"
          TASK_DEF=$(aws ecs describe-task-definition --task-definition "${{ matrix.task_family }}" --query 'taskDefinition' --output json)
          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq --arg IMAGE "$IMAGE_URI" --arg NAME "${{ matrix.container }}" '
            .containerDefinitions = (.containerDefinitions | map(if .name == $NAME then .image = $IMAGE else . end))
            | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
          ')
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF" --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "${{ env.ECS_CLUSTER }}" --service "${{ matrix.ecs_service }}" --task-definition "$NEW_ARN" --force-new-deployment

  # ============================================================
  # Step 3: Build and deploy all Python services
  # ============================================================
  deploy-python:
    runs-on: ubuntu-latest
    needs: init-database
    if: always() && (needs.init-database.result == 'success' || needs.init-database.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: processing-service
            ecr_repo: architecture/processing-service
            ecs_service: processing-service-dev
            task_family: processing-service-dev
            container: processing-service
          - service: ai-analysis-service
            ecr_repo: architecture/ai-analysis-service
            ecs_service: ai-analysis-service-dev
            task_family: ai-analysis-service-dev
            container: ai-analysis-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install and test
        working-directory: ${{ matrix.service }}
        run: |
          pip install -r requirements.txt
          pytest --tb=short -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:$IMAGE_TAG -t ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:latest ./${{ matrix.service }}
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:$IMAGE_TAG
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:latest

      - name: Deploy to ECS
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:$IMAGE_TAG"
          TASK_DEF=$(aws ecs describe-task-definition --task-definition "${{ matrix.task_family }}" --query 'taskDefinition' --output json)
          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq --arg IMAGE "$IMAGE_URI" --arg NAME "${{ matrix.container }}" '
            .containerDefinitions = (.containerDefinitions | map(if .name == $NAME then .image = $IMAGE else . end))
            | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
          ')
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF" --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "${{ env.ECS_CLUSTER }}" --service "${{ matrix.ecs_service }}" --task-definition "$NEW_ARN" --force-new-deployment

  # ============================================================
  # Step 4: Summary
  # ============================================================
  summary:
    runs-on: ubuntu-latest
    needs: [deploy-java, deploy-python]
    if: always()
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Print endpoints
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers --names arch-alb-dev --query 'LoadBalancers[0].DNSName' --output text)
          echo "============================================"
          echo "  DEPLOY COMPLETE"
          echo "============================================"
          echo ""
          echo "ALB Endpoint: http://$ALB_DNS"
          echo ""
          echo "API Endpoints:"
          echo "  Upload:  POST http://$ALB_DNS/api/v1/upload"
          echo "  Status:  GET  http://$ALB_DNS/api/v1/status/{id}"
          echo "  Reports: GET  http://$ALB_DNS/api/v1/reports/{id}"
          echo "  Health:  GET  http://$ALB_DNS/actuator/health"
          echo ""
          echo "============================================"
