name: Services CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - "api-gateway/**"
      - "upload-service/**"
      - "processing-service/**"
      - "ai-analysis-service/**"
      - "report-service/**"
      - "status-service/**"
      - ".github/workflows/services-ci-cd.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "api-gateway/**"
      - "upload-service/**"
      - "processing-service/**"
      - "ai-analysis-service/**"
      - "report-service/**"
      - "status-service/**"
  workflow_dispatch:
    inputs:
      force_deploy_all:
        description: "Force deploy all services"
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: architecture-cluster-dev
  ECR_REGISTRY: 177515264693.dkr.ecr.us-east-1.amazonaws.com

permissions:
  contents: read

jobs:
  # ============================================================
  # Detect which services changed
  # ============================================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api_gateway: ${{ steps.filter.outputs.api_gateway }}
      upload_service: ${{ steps.filter.outputs.upload_service }}
      processing_service: ${{ steps.filter.outputs.processing_service }}
      ai_analysis_service: ${{ steps.filter.outputs.ai_analysis_service }}
      report_service: ${{ steps.filter.outputs.report_service }}
      status_service: ${{ steps.filter.outputs.status_service }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api_gateway:
              - 'api-gateway/**'
            upload_service:
              - 'upload-service/**'
            processing_service:
              - 'processing-service/**'
            ai_analysis_service:
              - 'ai-analysis-service/**'
            report_service:
              - 'report-service/**'
            status_service:
              - 'status-service/**'

  # ============================================================
  # Java Services (API Gateway, Upload, Report, Status)
  # ============================================================
  build-java:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.api_gateway == 'true' ||
      needs.detect-changes.outputs.upload_service == 'true' ||
      needs.detect-changes.outputs.report_service == 'true' ||
      needs.detect-changes.outputs.status_service == 'true' ||
      inputs.force_deploy_all == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            changed: api_gateway
            ecr_repo: architecture/api-gateway
            ecs_service: api-gateway-dev
            task_family: api-gateway-dev
            container: api-gateway
            port: 8080
          - service: upload-service
            changed: upload_service
            ecr_repo: architecture/upload-service
            ecs_service: upload-service-dev
            task_family: upload-service-dev
            container: upload-service
            port: 8081
          - service: report-service
            changed: report_service
            ecr_repo: architecture/report-service
            ecs_service: report-service-dev
            task_family: report-service-dev
            container: report-service
            port: 8084
          - service: status-service
            changed: status_service
            ecr_repo: architecture/status-service
            ecs_service: status-service-dev
            task_family: status-service-dev
            container: status-service
            port: 8085
    steps:
      - uses: actions/checkout@v4
        if: needs.detect-changes.outputs[matrix.changed] == 'true' || inputs.force_deploy_all

      - name: Set up JDK 21
        if: needs.detect-changes.outputs[matrix.changed] == 'true' || inputs.force_deploy_all
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and Test
        if: needs.detect-changes.outputs[matrix.changed] == 'true' || inputs.force_deploy_all
        working-directory: ${{ matrix.service }}
        run: mvn -B clean verify package -DskipTests=false

      - name: Configure AWS credentials
        if: (needs.detect-changes.outputs[matrix.changed] == 'true' || inputs.force_deploy_all) && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        if: (needs.detect-changes.outputs[matrix.changed] == 'true' || inputs.force_deploy_all) && github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        if: (needs.detect-changes.outputs[matrix.changed] == 'true' || inputs.force_deploy_all) && github.event_name != 'pull_request'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:$IMAGE_TAG -t ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:latest ./${{ matrix.service }}
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:$IMAGE_TAG
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:latest

      - name: Deploy to ECS
        if: (needs.detect-changes.outputs[matrix.changed] == 'true' || inputs.force_deploy_all) && github.event_name != 'pull_request'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:$IMAGE_TAG"
          TASK_DEF=$(aws ecs describe-task-definition --task-definition "${{ matrix.task_family }}" --query 'taskDefinition' --output json)
          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq --arg IMAGE "$IMAGE_URI" --arg NAME "${{ matrix.container }}" '
            .containerDefinitions = (.containerDefinitions | map(if .name == $NAME then .image = $IMAGE else . end))
            | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
          ')
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF" --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "${{ env.ECS_CLUSTER }}" --service "${{ matrix.ecs_service }}" --task-definition "$NEW_ARN" --force-new-deployment

  # ============================================================
  # Python Services (Processing, AI Analysis)
  # ============================================================
  build-python:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.processing_service == 'true' ||
      needs.detect-changes.outputs.ai_analysis_service == 'true' ||
      inputs.force_deploy_all == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: processing-service
            changed: processing_service
            ecr_repo: architecture/processing-service
            ecs_service: processing-service-dev
            task_family: processing-service-dev
            container: processing-service
          - service: ai-analysis-service
            changed: ai_analysis_service
            ecr_repo: architecture/ai-analysis-service
            ecs_service: ai-analysis-service-dev
            task_family: ai-analysis-service-dev
            container: ai-analysis-service
    steps:
      - uses: actions/checkout@v4
        if: needs.detect-changes.outputs[matrix.changed] == 'true' || inputs.force_deploy_all

      - name: Set up Python
        if: needs.detect-changes.outputs[matrix.changed] == 'true' || inputs.force_deploy_all
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install dependencies and test
        if: needs.detect-changes.outputs[matrix.changed] == 'true' || inputs.force_deploy_all
        working-directory: ${{ matrix.service }}
        run: |
          pip install -r requirements.txt
          pytest --tb=short -q

      - name: Configure AWS credentials
        if: (needs.detect-changes.outputs[matrix.changed] == 'true' || inputs.force_deploy_all) && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        if: (needs.detect-changes.outputs[matrix.changed] == 'true' || inputs.force_deploy_all) && github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        if: (needs.detect-changes.outputs[matrix.changed] == 'true' || inputs.force_deploy_all) && github.event_name != 'pull_request'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:$IMAGE_TAG -t ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:latest ./${{ matrix.service }}
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:$IMAGE_TAG
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:latest

      - name: Deploy to ECS
        if: (needs.detect-changes.outputs[matrix.changed] == 'true' || inputs.force_deploy_all) && github.event_name != 'pull_request'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:$IMAGE_TAG"
          TASK_DEF=$(aws ecs describe-task-definition --task-definition "${{ matrix.task_family }}" --query 'taskDefinition' --output json)
          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq --arg IMAGE "$IMAGE_URI" --arg NAME "${{ matrix.container }}" '
            .containerDefinitions = (.containerDefinitions | map(if .name == $NAME then .image = $IMAGE else . end))
            | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
          ')
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF" --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "${{ env.ECS_CLUSTER }}" --service "${{ matrix.ecs_service }}" --task-definition "$NEW_ARN" --force-new-deployment
