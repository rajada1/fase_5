name: Services CI/CD (Monorepo)

on:
  push:
    branches: ["main"]
    paths:
      - "api-gateway/**"
      - "upload-service/**"
      - "processing-service/**"
      - "ai-analysis-service/**"
      - "report-service/**"
      - "status-service/**"
      - ".github/workflows/services-ci-cd.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "api-gateway/**"
      - "upload-service/**"
      - "processing-service/**"
      - "ai-analysis-service/**"
      - "report-service/**"
      - "status-service/**"
      - ".github/workflows/services-ci-cd.yml"
  workflow_dispatch:
    inputs:
      deploy_env:
        description: "Ambiente de deploy (ex.: dev, prod)"
        required: false
        default: dev
        type: string

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  DEPLOY_ENV: ${{ inputs.deploy_env || vars.DEPLOY_ENV || 'dev' }}

permissions:
  contents: read
  id-token: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api_gateway: ${{ steps.filter.outputs.api_gateway }}
      upload_service: ${{ steps.filter.outputs.upload_service }}
      processing_service: ${{ steps.filter.outputs.processing_service }}
      ai_analysis_service: ${{ steps.filter.outputs.ai_analysis_service }}
      report_service: ${{ steps.filter.outputs.report_service }}
      status_service: ${{ steps.filter.outputs.status_service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api_gateway:
              - 'api-gateway/**'
            upload_service:
              - 'upload-service/**'
            processing_service:
              - 'processing-service/**'
            ai_analysis_service:
              - 'ai-analysis-service/**'
            report_service:
              - 'report-service/**'
            status_service:
              - 'status-service/**'

  api-gateway:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api_gateway == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        working-directory: api-gateway
        run: mvn -B clean test package

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: api-gateway-${{ env.DEPLOY_ENV }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./api-gateway
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update ECS service
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: api-gateway-${{ env.DEPLOY_ENV }}
          IMAGE_TAG: ${{ github.sha }}
          CLUSTER_NAME: architecture-cluster-${{ env.DEPLOY_ENV }}
          ECS_SERVICE_NAME: api-gateway-service-${{ env.DEPLOY_ENV }}
          TASK_FAMILY: api-gateway-task-${{ env.DEPLOY_ENV }}
          CONTAINER_NAME: api-gateway
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          TASK_DEF_JSON=$(aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query 'taskDefinition' --output json)
          NEW_TASK_DEF=$(echo "$TASK_DEF_JSON" | jq --arg IMAGE "$IMAGE_URI" --arg NAME "$CONTAINER_NAME" '
            .containerDefinitions = (.containerDefinitions | map(if .name == $NAME then .image = $IMAGE else . end))
            | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
          ')
          NEW_TASK_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF" --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$CLUSTER_NAME" --service "$ECS_SERVICE_NAME" --task-definition "$NEW_TASK_ARN" --force-new-deployment

  upload-service:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.upload_service == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
