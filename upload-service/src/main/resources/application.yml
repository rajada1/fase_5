server:
  port: 8081

spring:
  application:
    name: upload-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:upload_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:architecture-diagrams-dev}
  sns:
    file-uploaded-topic-arn: ${AWS_SNS_FILE_UPLOADED_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:file-uploaded-topic-dev}
  endpoint: ${AWS_ENDPOINT:}

outbox:
  publisher:
    fixed-delay-ms: 5000
    max-retries: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

---
# Local development profile
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true

aws:
  endpoint: http://localhost:4566

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

aws:
  endpoint: ""
