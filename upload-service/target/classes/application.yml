server:
  port: 8081

spring:
  application:
    name: upload-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:upload_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

aws:
  region: us-east-1
  s3:
    bucket-name: architecture-diagrams-dev
  sns:
    file-uploaded-topic-arn: arn:aws:sns:us-east-1:000000000000:file-uploaded-topic-dev
  # Localstack configuration for local development
  endpoint: http://localhost:4566

outbox:
  publisher:
    fixed-delay-ms: 5000
    max-retries: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
